[test]
preload = ["./src/db/testing/test-teardown.ts"]

# `bun fmt`: Prettier's defaults except the 4-space indent. Every other option
# stays off on purpose (sortImports, sortTailwindcss, sortPackageJson, jsdoc
# rewrite code, and the formatter must only change layout). bun fmt also skips
# everything in any .gitignore of the repo; a *global* gitignore (e.g.
# ~/.config/git/ignore) is invisible to it, hence `.claude/` below.
[fmt]
tabWidth = 4
useTabs = false
ignorePatterns = [
    # Local Claude Code state: untracked, not ours to format.
    ".claude/",
    # Exported by scripts/export-figcraft-variables.ts from the FigCraft design and
    # compared by src/tokens-v2.test.ts; formatting it makes a re-export look like a diff.
    "design/figcraft-variables.json",
    # Lint-rule fixtures: deliberately shaped bad/good examples whose line numbers
    # scripts/lint-rules/rules.test.ts pins.
    "scripts/lint-rules/fixtures/",
]
