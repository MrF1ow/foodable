version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      groups:
          bun-minor-and-patch:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      commit-message:
          prefix: chore(deps)
      cooldown:
          default-days: 7

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions-minor-and-patch:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      commit-message:
          prefix: chore(deps)
      cooldown:
          default-days: 7

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      groups:
          docker-minor-and-patch:
              patterns: ["*"]
              update-types: ["minor", "patch"]
      commit-message:
          prefix: chore(deps)
      cooldown:
          default-days: 7
