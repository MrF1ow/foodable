name: CI

# Runs on every pull request and on every push to main. Railway deploys main,
# so this is the last gate before a change reaches the household's deploy.
#
# The format check keeps the tree prettier-clean, which is what makes
# `bun run format` safe to run: it only ever touches files you actually edited.

on:
    pull_request:
    push:
        branches: ["main"]

permissions:
    contents: read

# Cancel a superseded pull request run. A run on main must finish: Railway's
# Wait for CI can sit in WAITING when the run it is watching is cancelled.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate login templates
              run: bun run gen:all

            - name: Check formatting
              run: bun run format:check

            - name: Typecheck src/
              run: bun run typecheck

            - name: Run tests
              run: bun test

    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Build image
              run: docker build .

    migrations:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.2

            - name: Check migrations
              env:
                  BASE_REF: ${{ github.base_ref }}
                  EVENT_NAME: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT_NAME" = "pull_request" ]; then
                    git fetch --no-tags origin "$BASE_REF"
                    base="origin/$BASE_REF"
                  else
                    base="$BEFORE"
                    if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
                      exit 0
                    fi
                  fi
                  git cat-file -e "${base}^{commit}"
                  changed="$(git diff --name-only -M "$base" -- supabase/migrations)"
                  if [ -z "$changed" ]; then
                    echo "no migration changes"
                    exit 0
                  fi
                  bun run scripts/migration-safety.ts --base "$base"
                  echo "postgresql binaries:"
                  ls /usr/lib/postgresql || true
                  shopt -s nullglob
                  bins=(/usr/lib/postgresql/*/bin/initdb)
                  if [ ${#bins[@]} -eq 0 ]; then
                    sudo apt-get update
                    sudo apt-get install -y postgresql
                    bins=(/usr/lib/postgresql/*/bin/initdb)
                  fi
                  PG_BIN=$(dirname "${bins[0]}")
                  export PG_BIN
                  bun install --frozen-lockfile
                  bun run db:dryrun
