name: Gate

on:
    # zizmor: ignore[dangerous-triggers] — checks out the base branch only; does not run pull request code
    pull_request_target:
        types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
    contents: read
    # Strips gate:approved when a new push lands.
    pull-requests: write
    # Dates the latest push from the head commit's check suites.
    checks: read

jobs:
    gate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4

            - name: Require a code owner's gate:approved label for gate files
              env:
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  EVENT_ACTION: ${{ github.event.action }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  GH_TOKEN: ${{ github.token }}
              run: bun run scripts/conventions/gate.ts
