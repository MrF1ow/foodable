# Plain Postgres + Foodable app for local/self-hosted trials.
# Postgres 17 matches local Supabase (17.11) and current Supabase cloud majors.

services:
    migrate:
        build: .
        env_file: .env
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/foodable
        command: ["bun", "run", "db:migrate"]
        depends_on:
            postgres:
                condition: service_healthy

    app:
        build: .
        env_file: .env
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/foodable
        ports:
            - "${PORT:-8080}:8080"
        depends_on:
            migrate:
                condition: service_completed_successfully
        command: ["bun", "--smol", "src/index.ts"]

    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: foodable
        volumes:
            - foodable_pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d foodable"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    foodable_pg_data:
