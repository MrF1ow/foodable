<!doctype html>
<!--
  Notifications inbox (MCP Apps). Served for list_notices.

  One card: the person's notifications, personal ones first, then the
  household's, each with Dismiss calling dismiss_notice (for the person
  only) when the host supports server tools. Allergen rows have no Dismiss:
  they clear when the cause is fixed.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Notifications</title>
        <style>
            /*@include shared/v2/tokens.css@*/

            /*@include shared/v2/base.css@*/

            /*@include shared/v2/components.css@*/

            .row-wrap .err {
                margin: 4px 0 0;
                padding: 0 4px;
                font-size: 11px;
                line-height: 14px;
            }
            button.act[aria-disabled="true"] {
                pointer-events: none;
                opacity: 0.45;
            }
        </style>
    </head>
    <body>
        <div class="w" id="root"></div>

        <script>
            "use strict";

            /*@include shared/bridge.js@*/

            /*@include shared/util.js@*/

            /*@include shared/date.js@*/

            /*@include shared/v2/ui.js@*/

            const T = {
                title: "Notifications",
                loading: "Loading notifications…",
                empty: "Nothing needs attention.",
                emptyFiltered: "Nothing matches this filter.",
                personal: "For you",
                household: "Household",
                dismiss: "Dismiss",
                dismissFailed: "Could not dismiss.",
                snoozedUntil: "Snoozed until",
            };

            // What each kind is called, as Settings and the tools name it.
            const KIND_LABELS = {
                allergens: "Allergens",
                food_expiring: "Food expiring",
                running_low: "Running low",
                weigh_in_due: "Weigh-in due",
                recipe_changes: "Recipe changes by others",
                week_plan_changes: "Week plan changes",
                new_usuals: "New usual products",
            };

            const BUCKET_ORDER = ["personal", "household"];

            const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

            // The stored instant, as the viewer's own clock reads it: "Wed,
            // Dec 2, 19:30". A snooze is at most a year ahead, so the weekday
            // and date say which day without a year. Anything that is not a
            // date passes through untouched.
            function snoozedWhen(iso) {
                const d = new Date(iso);
                if (Number.isNaN(d.getTime())) return String(iso);
                const pad = (n) => String(n).padStart(2, "0");
                return `${WEEKDAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            }

            // A populated inbox: two kinds of condition, an allergen, and what
            // other people changed; some read, one for the person alone.
            const SAMPLE = {
                count: 4,
                notifications: [
                    {
                        id: "n-allergen",
                        kind: "allergens",
                        bucket: "household",
                        message: "Peanut butter contains peanut — Pat.",
                        created_at: "2026-12-01T14:05:00.000Z",
                        read: false,
                        snoozed_until: null,
                        can_dismiss_for_everyone: false,
                        subject: { kind: "grocery_line", id: "gl-pb" },
                        open: "/kitchen/groceries",
                    },
                    {
                        id: "n-salmon",
                        kind: "food_expiring",
                        bucket: "household",
                        message: "Salmon 1 lb expires tomorrow",
                        created_at: "2026-12-01T13:30:00.000Z",
                        read: false,
                        snoozed_until: null,
                        can_dismiss_for_everyone: true,
                        subject: { kind: "fridge_item", id: "fi-salmon" },
                        open: "/kitchen/fridge",
                    },
                    {
                        id: "n-weigh",
                        kind: "weigh_in_due",
                        bucket: "personal",
                        message: "You haven't weighed in for 9 days",
                        created_at: "2026-12-01T09:00:00.000Z",
                        read: false,
                        snoozed_until: null,
                        can_dismiss_for_everyone: false,
                        subject: { kind: "member", id: "u-alex" },
                        open: "/",
                    },
                    {
                        id: "n-plan",
                        kind: "week_plan_changes",
                        bucket: "household",
                        message:
                            "Sarah moved Lasagna from lunch on Mon, Nov 30 to dinner on Tue, Dec 1.",
                        created_at: "2026-11-30T18:20:00.000Z",
                        read: false,
                        snoozed_until: null,
                        can_dismiss_for_everyone: true,
                        subject: { kind: "recipe", id: "rec-lasagna" },
                        open: "/recipes/rec-lasagna",
                    },
                    {
                        id: "n-usual",
                        kind: "new_usuals",
                        bucket: "household",
                        message:
                            "Sarah added Eggs to the usuals with Kirkland Large Eggs.",
                        created_at: "2026-11-29T16:10:00.000Z",
                        read: true,
                        snoozed_until: null,
                        can_dismiss_for_everyone: true,
                        subject: { kind: "food", id: "f-eggs" },
                        open: "/kitchen/usuals",
                    },
                    {
                        id: "n-recipe",
                        kind: "recipe_changes",
                        bucket: "household",
                        message: "Sarah removed Beef chili.",
                        created_at: "2026-11-28T12:00:00.000Z",
                        read: true,
                        snoozed_until: null,
                        can_dismiss_for_everyone: true,
                        subject: { kind: "recipe", id: "rec-chili" },
                        open: "/recipes",
                    },
                ],
            };

            let MODEL = null;
            let API = null;
            let rootEl = null;
            const dismissing = new Set();
            const DISMISS_SETTLE_MS = 500;
            let dismissSettleUntil = 0;

            function card(inner) {
                return `<section class="card">${inner}</section>`;
            }

            // Allergen rows can't be dismissed: they clear when the cause does.
            function canDismiss(n, showDismiss) {
                return showDismiss && n.kind !== "allergens";
            }

            function rowNotification(n, showDismiss) {
                const key = String(n.id);
                const inFlight = dismissing.has(key);
                const kind = KIND_LABELS[n.kind] || "";
                const sub = n.snoozed_until
                    ? `${T.snoozedUntil} ${snoozedWhen(n.snoozed_until)}`
                    : kind;
                const row = {
                    dot: {
                        tone: n.read
                            ? "dim"
                            : n.kind === "allergens"
                              ? "over"
                              : "warn",
                    },
                    title: n.message,
                    sub,
                    attrs: { "data-notification-id": key },
                };
                if (canDismiss(n, showDismiss)) {
                    row.action = inFlight ? "…" : T.dismiss;
                    row.actionAttrs = {
                        "data-dismiss-key": key,
                        title: T.dismiss,
                        "aria-disabled": inFlight ? "true" : "false",
                    };
                }
                const err = MODEL && MODEL.errors && MODEL.errors[key];
                const errHtml = err
                    ? `<p class="err note is-warn">${esc(err)}</p>`
                    : "";
                return `<div class="row-wrap" data-notification-id="${esc(key)}">${v2Row(
                    row,
                )}${errHtml}</div>`;
            }

            function renderBody(data, showDismiss) {
                const list = Array.isArray(data.notifications)
                    ? data.notifications
                    : [];
                if (list.length === 0) {
                    const emptyCopy =
                        typeof data.count === "number" && data.count > 0
                            ? T.emptyFiltered
                            : T.empty;
                    return card(
                        v2Header(T.title) +
                            `<p class="note">${esc(emptyCopy)}</p>`,
                    );
                }
                const byBucket = new Map();
                list.forEach((n) => {
                    const bucket =
                        n.bucket === "personal" ? "personal" : "household";
                    const rows = byBucket.get(bucket) || [];
                    rows.push(rowNotification(n, showDismiss));
                    byBucket.set(bucket, rows);
                });
                const groups = BUCKET_ORDER.filter((b) => byBucket.has(b)).map(
                    (b) =>
                        `<div class="grp">${v2Label(T[b])}<div class="rows">${byBucket
                            .get(b)
                            .join("")}</div></div>`,
                );
                const unread =
                    typeof data.count === "number"
                        ? data.count
                        : list.filter((n) => !n.read).length;
                return card(
                    v2Header(T.title, unread > 0 ? String(unread) : undefined) +
                        groups.join(""),
                );
            }

            function render(data) {
                rootEl = document.getElementById("root");
                if (!data || typeof data !== "object") {
                    v2Paint(
                        card(
                            v2Header(T.title) +
                                `<p class="note">${esc(T.empty)}</p>`,
                        ),
                    );
                    return;
                }
                MODEL = {
                    count: data.count ?? 0,
                    notifications: Array.isArray(data.notifications)
                        ? data.notifications.map((n) => ({ ...n }))
                        : [],
                    errors: MODEL && MODEL.errors ? { ...MODEL.errors } : {},
                };
                const showDismiss = !!(API && API.canCallTools);
                v2Paint(renderBody(MODEL, showDismiss));
            }

            function removeNotification(id) {
                if (!MODEL || !id) return;
                const gone = MODEL.notifications.find(
                    (n) => String(n.id) === id,
                );
                if (!gone) return;
                MODEL.notifications = MODEL.notifications.filter(
                    (n) => String(n.id) !== id,
                );
                // The count is the unread ones: only an unread row lowers it.
                if (!gone.read) MODEL.count = Math.max(0, MODEL.count - 1);
                if (MODEL.errors[id]) delete MODEL.errors[id];
                const showDismiss = !!(API && API.canCallTools);
                v2Paint(renderBody(MODEL, showDismiss));
            }

            function setRowError(id, message) {
                if (!MODEL) return;
                MODEL.errors[id] = message;
                const showDismiss = !!(API && API.canCallTools);
                v2Paint(renderBody(MODEL, showDismiss));
            }

            async function onDismissClick(id) {
                if (!MODEL || !API || !API.canCallTools) return;
                if (!id || dismissing.has(id)) return;
                const notification = MODEL.notifications.find(
                    (n) => String(n.id) === id,
                );
                if (!notification || notification.kind === "allergens") return;
                if (MODEL.errors[id]) delete MODEL.errors[id];
                dismissing.add(id);
                const showDismiss = !!(API && API.canCallTools);
                v2Paint(renderBody(MODEL, showDismiss));
                try {
                    const res = await API.callTool("dismiss_notice", {
                        notification_id: id,
                        scope: "me",
                    });
                    const sc =
                        (res && res.structuredContent) ||
                        (res && res.result && res.result.structuredContent);
                    if (sc && sc.dismissed === true) {
                        dismissing.delete(id);
                        dismissSettleUntil = Date.now() + DISMISS_SETTLE_MS;
                        removeNotification(id);
                        return;
                    }
                    const text =
                        (res &&
                            res.content &&
                            res.content[0] &&
                            res.content[0].text) ||
                        T.dismissFailed;
                    dismissing.delete(id);
                    setRowError(id, text);
                } catch (e) {
                    dismissing.delete(id);
                    setRowError(
                        id,
                        e && e.message ? String(e.message) : T.dismissFailed,
                    );
                }
            }

            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (
                    typeof payload.count === "number" &&
                    Array.isArray(payload.notifications)
                ) {
                    return payload;
                }
                if (payload.structuredContent)
                    return coerce(payload.structuredContent);
                return null;
            }

            initWidget({
                name: "attention-widget",
                loading: `<div class="empty">${esc(T.loading)}</div>`,
                coerce,
                render: v2BridgeRender(render),
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                    if (MODEL) render(MODEL);
                    const root = document.getElementById("root");
                    root.addEventListener("click", (e) => {
                        const btn =
                            e.target && e.target.closest
                                ? e.target.closest("button.act")
                                : null;
                        if (!btn) return;
                        if (btn.disabled) return;
                        if (btn.getAttribute("aria-disabled") === "true")
                            return;
                        if (Date.now() < dismissSettleUntil) return;
                        const raw = btn.getAttribute("data-dismiss-key");
                        if (raw == null || raw === "") return;
                        e.preventDefault();
                        onDismissClick(raw);
                    });
                },
            });
        </script>
    </body>
</html>
